<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mavuri - Teste API Mercado Livre</title><style>body{font-family:Arial,sans-serif;margin:30px;background:#f5f5f5;color:#222}.box{background:white;padding:20px;border-radius:8px;border:1px solid #ddd;margin-bottom:20px;max-width:1000px}input{width:100%;box-sizing:border-box;padding:12px;font-size:14px;margin:8px 0 15px}button{padding:12px 20px;font-size:15px;cursor:pointer;margin-right:10px;margin-bottom:10px}pre{white-space:pre-wrap;word-break:break-word;background:#111;color:#eee;padding:20px;border-radius:8px;margin-top:20px;max-height:60vh;overflow:auto}.aviso{color:#666;font-size:14px}</style></head><body><h1>Mavuri - Teste da API do Mercado Livre</h1><div class="box"><h2>1. Access Token</h2><p class="aviso">O token é usado somente nesta sessão para testar a autenticação e não é salvo no navegador.</p><input type="password" id="token" placeholder="APP_USR-xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off"><button id="salvarToken">USAR TOKEN</button><button id="testarUsuario">TESTAR /users/me</button></div><div class="box"><h2>2. Busca de produtos</h2><input type="text" id="busca" placeholder="Ex.: notebook gamer"><button id="buscarProdutos">BUSCAR PRODUTOS</button><button id="diagnosticarBusca">DIAGNOSTICAR BUSCA</button></div><div class="box"><h2>3. Categorias</h2><button id="testarCategorias">TESTAR CATEGORIAS</button></div><pre id="resultado">Aguardando...</pre><script src="app.js"></script></body></html>
